# PostgreSQL minimal configuration for development

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

listen_addresses = '*'
port = 5432
max_connections = 300

# Disable SSL for development
ssl = off

#------------------------------------------------------------------------------
# MEMORY
#------------------------------------------------------------------------------

shared_buffers = 128MB
work_mem = 4MB

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

# Docker captures stderr. The collector would write postgresql.log under
# /var/log/postgresql, which is not writable by postgres on Debian 13
# and is not stored on a volume.
log_destination = 'stderr'
logging_collector = off

# Log slow queries (over 1 second)
log_min_duration_statement = 1000

#------------------------------------------------------------------------------
# DEVELOPMENT OPTIMIZATIONS
#------------------------------------------------------------------------------

# Faster commits for development (less durability)
synchronous_commit = off
fsync = off

# Basic locale settings
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
